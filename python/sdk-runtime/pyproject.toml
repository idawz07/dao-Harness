[build-system]
requires = ["hatchling==1.30.1"]
build-backend = "hatchling.build"

[project]
name = "dao-runtime-bin"
version = "0.0.0.dev0"
description = "Bundled dao CLI runtime for the Dao Python SDK"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
authors = [{ name = "Dao" }]

[project.urls]
Homepage = "https://github.com/daoAI/dao"
Documentation = "https://github.com/daoAI/dao/blob/master/python/sdk-runtime/README.md"
Issues = "https://github.com/daoAI/dao/issues"
Source = "https://github.com/daoAI/dao"

[project.scripts]
dao = "dao_runtime:main"

# Include the injected dao executable and sidecars; exclude the dev-only node closure.
[tool.hatch.build]
artifacts = ["src/dao_runtime/runtime/dao-sdk-runtime-*"]
exclude = ["src/dao_runtime/runtime/node"]

[tool.hatch.build.targets.wheel]
packages = ["src/dao_runtime"]

[tool.hatch.build.targets.wheel.hooks.custom]

[tool.hatch.build.targets.sdist.hooks.custom]
