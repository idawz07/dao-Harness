# Replay-only patch layered after `cordis.yml`: replace the network adapter
# with recorded JSONL, pin the recorded top-level model, and keep persistence
# raw for fixture harvesting.

- id: llm-pi-ai
  disabled: true

- id: acp
  name: '@daoai/dao-acp'
  config:
    provider: llama-router
    model: Qwen3.8-27B-Q6_K_XL-128K

- id: session-persistence-jsonl
  name: '@daoai/dao-session-persistence-jsonl'
  config:
    root: !!js process.env.DAO_SNAPSHOT_SESSIONS_ROOT ?? daoHomePath('sessions')
    compression: none

- id: sandbox
  name: '@daoai/dao-sandbox-local'
  config:
    runnerCommand:
      - bash
      - -c
      - while [ "$1" != "--" ]; do shift; done; shift; exec "$@"
      - passthrough-runner
    runnerFailureSignatures:
      - 'passthrough-runner: profile rejected'

- insert:
    - id: llm-replay
      name: '@daoai/dao-llm-replay'
      config:
        providers:
          - id: llama-router
            name: Local Llama Router
            models:
              - id: Qwen3.8-27B-Q6_K_XL-128K
                contextWindow: 131072
                defaultMaxTokens: 65536
                reasoningEfforts: ['off', 'minimal', 'low', 'medium', 'high']
                defaultReasoningEffort: high

    - id: subagent-settlement-marker
      name: './subagent-settlement-marker.ts'
