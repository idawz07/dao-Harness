# Session-title snapshot composition: the optional first-prompt provider uses
# the ordinary DeepSeek route while the every other capability stay
# identical to the base example.
- insert:
    - id: session-title-provider
      name: '@daoai/dao-session-title-first-prompt-llm'
      config:
        targetWords: 5
        targetCjkCharacters: 10
        maxInputBytes: 4096
        maxOutputTokens: 32
        timeoutMs: 5000
        provider: llama-router
        model: Qwen3.8-27B-Q6_K_XL-128K
