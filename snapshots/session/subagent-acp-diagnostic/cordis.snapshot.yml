# Keyless twin of subagent-acp-diagnostic.cordis.yml: keep the real ACP child
# permission-denial path and replace only the external parent model adapter.

- id: llm-pi-ai
  disabled: true

- insert:
    - id: llm-replay
      name: '@daoai/dao-llm-replay'
      config:
        providers:
          - id: llama-router
            name: Local Llama Router
            models:
              - id: Qwen3.8-27B-Q6_K_XL-128K
                contextWindow: 131072
                defaultMaxTokens: 65536
                reasoningEfforts: ['off', 'minimal', 'low', 'medium', 'high']
                defaultReasoningEffort: high
    - id: subagent-acp-diagnostic
      name: '@daoai/dao-subagent-acp'
      config:
        providerName: acp-diagnostic
        command: !!js process.execPath
        args:
          - !!js "decodeURIComponent(new URL('../../../packages/subagent/subagent-acp/tests/mock-acp-server.ts', 'file://' + process.env.DAO_SNAPSHOT_FILE).pathname)"
        permission: reject
        env:
          MOCK_PERMISSION: '1'
          MOCK_TOOL_KIND: execute
    - id: tool-subagent-acp-diagnostic
      name: '@daoai/dao-tool-subagent'
      config:
        provider: acp-diagnostic
        toolName: subagent_acp
        backgroundMode: one-shot
        maxDepth: provider-managed
