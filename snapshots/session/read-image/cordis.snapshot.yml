# Keyless replay for the read-image success scenario. This profile patch swaps
# the adapter and re-pins the recorded vision model. The replay catalog declares image input,
# so the strict read_image gate accepts the route and the tool result carries
# the durable image block.

- id: agent-default-model
  name: '@daoai/dao-agent-default-model'
  config:
    provider: llama-router
    model: Qwen3.8-27B-Q6_K_XL-128K-vision-exp

- id: session-persistence-jsonl
  name: '@daoai/dao-session-persistence-jsonl'
  config:
    root: !!js daoHomePath('sessions')
    compression: none

- id: agent-instructions
  name: '@daoai/dao-agent-instructions'
  config:
    maxBytes: 65536

- id: system-prompt
  name: '@daoai/dao-system-prompt'
  config:
    persona: |
      You are a coding assistant powered by the {{model}} model. Your working directory is {{cwd}}. Your bash tool runs under a file sandbox — a `[sandbox: file access denied …]` result is policy, not a command bug.

      Verify your work by running the code or tests. Keep answers brief and factual.

- insert:
    - id: llm-replay
      name: '@daoai/dao-llm-replay'
      config:
        providers:
          - id: llama-router
            name: DeepSeek
            models:
              - id: Qwen3.8-27B-Q6_K_XL-128K
                inputModalities: [text]
              - id: Qwen3.8-27B-Q6_K_XL-128K
                inputModalities: [text]
              - id: Qwen3.8-27B-Q6_K_XL-128K-vision-exp
                inputModalities: [text, image]

- id: attachment-local
  name: '@daoai/dao-attachment-local'
