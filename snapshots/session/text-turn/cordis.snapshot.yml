# Replay patch shared by the ordinary headless snapshot composition. The model
# script comes from the scenario's committed session JSONL.

- id: session-title-llm
  disabled: true

- id: session-persistence-jsonl
  name: '@daoai/dao-session-persistence-jsonl'
  config:
    root: !!js daoHomePath('sessions')
    compression: none

- id: sandbox
  name: '@daoai/dao-sandbox-local'
  config:
    runnerCommand:
      - bash
      - -c
      - while [ "$1" != "--" ]; do shift; done; shift; exec "$@"
      - passthrough-runner
    runnerFailureSignatures:
      - 'passthrough-runner: profile rejected'

- insert:
    - id: llm-replay
      name: '@daoai/dao-llm-replay'
      config:
        providers:
          - id: llama-router
            name: DeepSeek
            models:
              - id: Qwen3.8-27B-Q6_K_XL-128K
              - id: Qwen3.8-27B-Q6_K_XL-128K
