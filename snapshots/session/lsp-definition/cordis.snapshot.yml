# Keyless replay keeps the LSP composition intact and replaces only the model adapter.

- id: llm-pi-ai
  disabled: true

- insert:
    - id: lsp
      name: '@daoai/dao-lsp'
    - id: lsp-stdio
      name: '@daoai/dao-lsp-stdio'
      config:
        servers:
          fixture:
            command: !!js process.execPath
            args: ['./lsp-server.mjs']
            extensionToLanguage:
              '.ts': typescript
    - id: tool-lsp
      name: '@daoai/dao-tool-lsp'
      config:
        maxLocations: 1
    - id: llm-replay
      name: '@daoai/dao-llm-replay'
      config:
        providers:
          - id: llama-router
            name: Local Llama Router
            models:
              - id: Qwen3.8-27B-Q6_K_XL-128K
                contextWindow: 131072
                defaultMaxTokens: 65536
                reasoningEfforts: ['off', 'minimal', 'low', 'medium', 'high']
                defaultReasoningEffort: high

- id: timeout-policy
  name: '@daoai/dao-tool-call-timeout-policy'
