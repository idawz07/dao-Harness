# Keyless replay counterpart of agent-instructions.cordis.yml: apply the
# scenario values and model swap to the ACP profile.

- id: agent-default-model
  name: '@daoai/dao-agent-default-model'
  config:
    provider: llama-router
    model: Qwen3.8-27B-Q6_K_XL-128K

- id: session-persistence-jsonl
  name: '@daoai/dao-session-persistence-jsonl'
  config:
    root: !!js daoHomePath('sessions')
    compression: none

- id: agent-instructions
  name: '@daoai/dao-agent-instructions'
  config:
    maxBytes: 65536
    daoHome: !!js process.cwd() + '/.dsh'
    projectRootMarkers:
      - .dsh-project

- id: system-prompt
  name: '@daoai/dao-system-prompt'
  config:
    persona: |
      You are a coding assistant powered by the {{model}} model. Your working directory is {{cwd}}.

      Verify your work by running the code or tests. Keep answers brief and factual.

- insert:
    - id: llm-replay
      name: '@daoai/dao-llm-replay'
      config:
        providers:
          - id: llama-router
            name: DeepSeek
            models:
              - id: Qwen3.8-27B-Q6_K_XL-128K
              - id: Qwen3.8-27B-Q6_K_XL-128K
    - id: workspace-context-compaction
      name: '../../../packages/test-support/session-snapshot/tests/fixtures/workspace-context-compaction.ts'
