# Keyless replay counterpart to pty.cordis.yml.

- id: llm-pi-ai
  disabled: true

- insert:
    - id: pty
      name: '@daoai/dao-terminal'
    - id: pty-snapshot-backend
      name: './pty-snapshot-backend.mjs'
    - id: tool-terminal
      name: '@daoai/dao-tool-terminal'
      config:
        maxResultBytes: 64
    - id: llm-replay
      name: '@daoai/dao-llm-replay'
      config:
        providers:
          - id: llama-router
            name: Local Llama Router
            models:
              - id: Qwen3.8-27B-Q6_K_XL-128K
                contextWindow: 131072
                defaultMaxTokens: 65536
                reasoningEfforts: ['off', 'minimal', 'low', 'medium', 'high']
                defaultReasoningEffort: high
