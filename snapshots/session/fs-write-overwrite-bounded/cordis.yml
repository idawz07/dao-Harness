# Live counterpart for the bounded-overwrite-diff snapshot: the base stack with
# the fs backend's overwrite diff-basis limit shrunk so a modest replacement
# crosses the exclusive bound and the write result falls back to a whole-file
# diff. A config patch replaces the row's whole config, so `cwd` is restated
# verbatim, and the acp-agent restatement re-pins `Qwen3.8-27B-Q6_K_XL-128K` to match
# the recorded corpus and its pinned request headers.
- id: agent-default-model
  name: '@daoai/dao-agent-default-model'
  config:
    provider: llama-router
    model: Qwen3.8-27B-Q6_K_XL-128K

- id: session-persistence-jsonl
  name: '@daoai/dao-session-persistence-jsonl'
  config:
    root: !!js daoHomePath('sessions')
    compression: !!js 'process.env.DAO_SNAPSHOT === undefined ? ''zstd'' : ''none'''

- id: agent-instructions
  name: '@daoai/dao-agent-instructions'
  config:
    maxBytes: 65536

- id: system-prompt
  name: '@daoai/dao-system-prompt'
  config:
    persona: |
      You are a coding assistant powered by the {{model}} model. Your working directory is {{cwd}}. Your bash tool runs under a file sandbox — a `[sandbox: file access denied …]` result is policy, not a command bug.

      Verify your work by running the code or tests. Keep answers brief and factual.

- id: fs-sandbox
  name: '@daoai/dao-fs-sandbox'
  config:
    cwd: !!js process.cwd()
    diffBasisMaxBytes: 64
