# Keyless filesystem snapshots combine spill settings with replay. The
# sandboxed filesystem stack already lives in `dsh-base`; the ACP row re-pins
# `Qwen3.8-27B-Q6_K_XL-128K` for the recorded corpus.

- id: agent-default-model
  name: '@daoai/dao-agent-default-model'
  config:
    provider: llama-router
    model: Qwen3.8-27B-Q6_K_XL-128K

- id: session-persistence-jsonl
  name: '@daoai/dao-session-persistence-jsonl'
  config:
    root: !!js daoHomePath('sessions')
    compression: none

- id: agent-instructions
  name: '@daoai/dao-agent-instructions'
  config:
    maxBytes: 65536

- id: system-prompt
  name: '@daoai/dao-system-prompt'
  config:
    persona: |
      You are a coding assistant powered by the {{model}} model. Your working directory is {{cwd}}. Your bash tool runs under a file sandbox — a `[sandbox: file access denied …]` result is policy, not a command bug.

      Verify your work by running the code or tests. Keep answers brief and factual.

- insert:
    - id: llm-replay
      name: '@daoai/dao-llm-replay'
      config:
        providers:
          - id: llama-router
            name: DeepSeek
            models:
              - id: Qwen3.8-27B-Q6_K_XL-128K
              - id: Qwen3.8-27B-Q6_K_XL-128K

- id: spill-local
  name: '@daoai/dao-spill-local'
  config:
    root: !!js process.env.DAO_SNAPSHOT_SPILL_ROOT ?? './.spill'

- id: spill-policy
  name: '@daoai/dao-spill-policy'
  config:
    maxInlineBytes: 800
