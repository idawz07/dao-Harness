# Keyless replay combines PTC mode with the durable image store and an exact
# image-capable replay route. The scenario generates its tiny PNG inside the
# run_code program, then exercises read_image as a nested dispatch.

- id: llm-pi-ai
  disabled: true

- id: agent-default-model
  name: '@daoai/dao-agent-default-model'
  config:
    provider: llama-router
    model: Qwen3.8-27B-Q4_K_XL-128K-Vision

- id: session-persistence-jsonl
  name: '@daoai/dao-session-persistence-jsonl'
  config:
    root: !!js daoHomePath('sessions')
    compression: none

- id: agent-instructions
  name: '@daoai/dao-agent-instructions'
  config:
    maxBytes: 65536

- id: tools
  name: '@daoai/dao-tools'
  config:
    mode: ptc

- id: system-prompt
  name: '@daoai/dao-system-prompt'
  config:
    persona: |
      You are a coding assistant powered by the {{model}} model. Your working directory is {{cwd}}.

      Verify your work by running the code or tests. Keep answers brief and factual.

- insert:
    - id: llm-replay
      name: '@daoai/dao-llm-replay'
      config:
        providers:
          - id: llama-router
            name: Local Llama Router
            models:
              - id: Qwen3.8-27B-Q6_K_XL-128K
                contextWindow: 131072
                defaultMaxTokens: 65536
                reasoningEfforts: ['off', 'minimal', 'low', 'medium', 'high']
                defaultReasoningEffort: high
                inputModalities: [text]
              - id: Qwen3.8-27B-Q4_K_XL-128K-Vision
                contextWindow: 131072
                defaultMaxTokens: 65536
                inputModalities: [text, image]
                reasoningEfforts: ['off', 'minimal', 'low', 'medium', 'high']
                defaultReasoningEffort: high

- id: attachment-local
  name: '@daoai/dao-attachment-local'
