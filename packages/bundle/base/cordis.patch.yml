# The dao-base bundle patch: the shared core of each base-backed profile, applied as
# ONE insert over the empty profile root. Later bundle patches and the user's
# profile cordis.patch.yml address these rows by id, with the last write
# winning per row.
#
# A patch replaces the targeted row's whole `config` rather than merging into
# it, so a row whose value differs by mode does NOT live here: it belongs to
# each mode bundle, keeping any single row down to one bundle layer plus the
# user's. Mode-specific rows appear below only with shared plugin identity and
# neutral defaults; each mode bundle restates its complete configuration.
#
# Row order carries no load semantics (activation is service-availability
# driven); the grouping is for readers.

- insert:
    - id: timer
      name: '@daoai/cordis-plugin-timer'

    # Module reload is opt-in per profile. `patchReload: live` config watching
    # uses the launcher's watch-only fallback and does not require this row.
    - id: hmr
      name: '@daoai/cordis-plugin-hmr'
      disabled: true
      config:
        root: ['.']

    - id: llm
      name: '@daoai/dao-llm'

    - id: session
      name: '@daoai/dao-session'

    - id: typert
      name: '@daoai/dao-typert-registry'

    - id: typert-loader
      name: '@daoai/dao-typert-loader'

    - id: typert-gateway
      name: '@daoai/dao-api-gateway'

    - id: session-title
      name: '@daoai/dao-session-title'
      config:
        fallbackMaxWords: 5
        fallbackMaxBytes: 40
        maxTitleBytes: 80

    - id: session-title-llm
      name: '@daoai/dao-session-title-first-prompt-llm'
      config:
        targetWords: 5
        targetCjkCharacters: 10
        maxInputBytes: 4096
        maxOutputTokens: 64
        timeoutMs: 60000

    - id: user-questions
      name: '@daoai/dao-user-questions'

    - id: agent
      name: '@daoai/dao-agent'

    # The transport-independent default for Agents created by entry points.
    # Settings may supply a saved selection; consumers read it at creation time.
    # Shipped default: the resident llama-router card's main preset.
    - id: agent-default-model
      name: '@daoai/dao-agent-default-model'
      config:
        provider: llama-router
        model: Qwen3.8-27B-Q6_K_XL-128K

    - id: jobs
      name: '@daoai/dao-jobs-local'

    - id: llm-retry
      name: '@daoai/dao-llm-retry'

    # User-settings document (`$DAO_HOME/settings.yaml`, hot-reloaded): a
    # `llm-pi-ai:` section there overrides the adapter entry below without a
    # restart, and is what the web Models page writes.
    - id: settings
      name: '@daoai/dao-settings-file'

    # Credential sources: inherited environment over the managed
    # `$DAO_HOME/.credentials.yaml`, with project and user `.env` fallbacks.
    # Adapters resolve references per request; the Models page writes only the
    # managed document, which is never materialized into the process environment.
    - id: credentials
      name: '@daoai/dao-credentials-local'

    # The pi-ai adapter, carrying the local Qwen3.8 farm on tailscale. The
    # llama router (port 8081) is the resident systemd card and the shipped
    # default; the four vLLM cards (ports 18080–18083) are on-demand, declared
    # so a card started through the service manager (port 8767) serves
    # immediately and is refused only while down. A `llm-pi-ai:` settings
    # section replaces this entry's whole config without a restart, which is
    # what the web Models page does. No key is inlined: each route resolves its
    # apiKeyEnv reference per request through the credential store below. Context
    # windows are the cards' per-slot sizes, not trained model windows.
    - id: llm-pi-ai
      name: '@daoai/dao-llm-pi-ai'
      config:
        providers:
          llama-router:
            displayName: Local Llama Router
            apiKeyEnv: LLAMA_ROUTER_API_KEY
            api: openai-completions
            baseURL: http://100.110.212.93:8081/v1
            reasoning: high
            compat:
              thinkingFormat: qwen-chat-template
            models:
              - id: Qwen3.8-27B-Q6_K_XL-128K
                contextWindow: 131072
                maxTokens: 65536
                reasoningEfforts: { off: , minimal: minimal, low: low, medium: medium, high: high }
              - id: Qwen3.8-27B-Q6_K_XL-128K-NoThink
                contextWindow: 131072
                maxTokens: 65536
                input: [text, image]
                reasoningEfforts: false
              - id: Qwen3.8-27B-Q4_K_XL-128K-Vision
                contextWindow: 131072
                maxTokens: 65536
                input: [text, image]
                reasoningEfforts: { off: , minimal: minimal, low: low, medium: medium, high: high }
              - id: Qwen3.8-27B-AD-Q5_K_M-256K-P1-Vision
                contextWindow: 196608
                maxTokens: 65536
                input: [text, image]
                reasoningEfforts: { off: , minimal: minimal, low: low, medium: medium, high: high }
              - id: Qwen3.8-27B-AD-Q5_K_M-256K-P2-Vision
                contextWindow: 131072
                maxTokens: 65536
                input: [text, image]
                reasoningEfforts: { off: , minimal: minimal, low: low, medium: medium, high: high }
              - id: Ornith-1.0-35B
                contextWindow: 131072
                maxTokens: 65536
                input: [text, image]
                reasoningEfforts: false
              - id: Gemma4-12B-Unified
                contextWindow: 32768
                maxTokens: 32768
                input: [text, image]
                reasoningEfforts: false
              - id: Gemma4-E2B-Uncensored-HauhauCS-Aggressive
                contextWindow: 32768
                maxTokens: 32768
                reasoningEfforts: { off: , minimal: minimal, low: low, medium: medium, high: high }
          qwen38-quasar-262k:
            displayName: Qwen3.8 QUASAR 262K (vLLM card)
            apiKeyEnv: QWEN38_QUASAR_API_KEY
            api: openai-completions
            baseURL: http://100.110.212.93:18081/v1
            reasoning: high
            compat:
              thinkingFormat: qwen-chat-template
              supportsDeveloperRole: false
              supportsThinkingTokenBudget: true
            models:
              - id: qwen38-quasar-nvfp4
                name: Qwen3.8-27B QUASAR-QAT NVFP4 262K
                contextWindow: 262144
                maxTokens: 49152
                input: [text, image]
                reasoningEfforts: { off: , minimal: minimal, low: low, medium: medium, high: high, xhigh: xhigh }
          qwen38-cyanwiki-192k:
            displayName: Qwen3.8 Cyanwiki 192K (vLLM card)
            apiKeyEnv: QWEN38_CYANWIKI_API_KEY
            api: openai-completions
            baseURL: http://100.110.212.93:18080/v1
            reasoning: high
            compat:
              thinkingFormat: qwen
              supportsReasoningEffort: true
              supportsDeveloperRole: false
            models:
              - id: qwen38-cyanwiki-awq-g32
                name: Qwen3.8-27B Cyanwiki AWQ 192K (G32 W4A16, MTP-2)
                contextWindow: 196608
                maxTokens: 65536
                input: [text, image]
                reasoningEfforts: { off: , minimal: minimal, low: low, medium: medium, high: high, xhigh: xhigh, max: xhigh }
          qwen38-unsloth-nvfp4-131k:
            displayName: Qwen3.8 Unsloth 131K (vLLM card)
            apiKeyEnv: QWEN38_UNSLOTH_API_KEY
            api: openai-completions
            baseURL: http://100.110.212.93:18082/v1
            reasoning: high
            compat:
              thinkingFormat: qwen-chat-template
              supportsReasoningEffort: false
              supportsDeveloperRole: false
              supportsFinishReason: false
            models:
              - id: qwen38-unsloth-nvfp4
                name: Qwen3.8-27B Unsloth NVFP4 Dynamic V3 131K
                contextWindow: 131072
                maxTokens: 65536
                input: [text, image]
                reasoningEfforts: { off: , minimal: minimal, low: low, medium: medium, high: high, xhigh: xhigh }
          qwen38-ninfer-nvfp4full-262k:
            displayName: Qwen3.8 NInfer 262K (vLLM card)
            apiKeyEnv: QWEN38_NINFER_API_KEY
            api: openai-completions
            baseURL: http://100.110.212.93:18083/v1
            reasoning: high
            compat:
              thinkingFormat: qwen
              supportsReasoningEffort: true
              supportsDeveloperRole: false
            models:
              - id: qwen38-ninfer-nvfp4full
                name: Qwen3.8-27B NInfer NVFP4 Full 262K
                contextWindow: 262144
                maxTokens: 65536
                input: [text, image]
                reasoningEfforts: { off: , minimal: minimal, low: low, medium: medium, high: high, xhigh: xhigh, max: xhigh }

    - id: session-persistence-jsonl
      name: '@daoai/dao-session-persistence-jsonl'
      config:
        root: !!js daoHomePath('sessions')

    # Durable image bytes live outside the append-only session log. Messages
    # keep content-addressed references that this shared backend resolves for
    # provider requests and authorized history reads.
    - id: attachment-local
      name: '@daoai/dao-attachment-local'

    # Full-text session search is opt-in. `openAt: never` keeps
    # ctx.sessionQuery mounted — exact reads, titles, and lineage traces
    # (session export, subagent-fork Workspace inheritance) stay available —
    # while search calls fail with SESSION_QUERY_SEARCH_DISABLED and SQLite is
    # never opened; the Web sidebar search matches titles and workspace names
    # only. Deployments enabling content search override `openAt` to
    # `first-search` or `startup` in a later patch layer (profile
    # cordis.patch.yml or a --patch overlay), typically with a durable `path`.
    - id: session-query-sqlite
      name: '@daoai/dao-session-query-sqlite'
      config:
        path: ':memory:'
        openAt: never

    # Shared projection registry: subagent catalog identity (mode/label) folds
    # through its registered units, so the `list_agents` surface below fails
    # loud without it; web layers reuse this same mount for list rows.
    - id: session-projection
      name: '@daoai/dao-session-projection'

    # Durable KV storage: the storage hub, the json backend, and the
    # schema-validated domain form over them. Session-layer persistence (the
    # projection cache below; workspace and message-feedback in web layers)
    # routes through this stack, so it belongs to the shared base.
    - id: storage
      name: '@daoai/dao-storage'

    - id: storage-json
      name: '@daoai/dao-storage-json'
      config:
        root: !!js daoHomePath('storages')

    - id: storage-domain
      name: '@daoai/dao-storage-domain'
      config:
        backend: json

    # Squad XP / level / badges: folds session events into the squadProgress
    # projection unit and mirrors each view into the squad_progress storage
    # domain. Web lineage chips read the projection; Host code can call
    # ctx.squadProgress.get(sessionId).
    - id: squad-progress
      name: '@daoai/dao-squad-progress'

    # Persisted projection cache: throttled write-behind over the
    # session_projcache domain (per-record layout — one version-stamped
    # checkpoint document per session), serving the session listing's
    # projection column.
    - id: session-projection-cache
      name: '@daoai/dao-session-projection-cache'
      config:
        writeEveryEvents: 200
        writeIntervalMs: 5000

    # Session telemetry defaults to feedback-gated sharing: FEEDBACK_ONLY
    # uploads only when the user records /feedback, releasing the session
    # records since the last handoff through that event (a resumed session
    # shares only its current lifecycle). DAO_TELEMETRY_MODE overrides to
    # FULL or DISABLED; uploading mirrors session-log records onto OTLP/HTTP
    # logs with no session-telemetry/record redaction rule, so exports are
    # the raw captured copy. The deployment stance, env seams, and follow-ups
    # are pinned in the feedback-gated-default Agent Note. A non-empty
    # DAO_TELEMETRY_DISABLED — any value, including '0'/'false' — opts the
    # process out (the launchers patch the row disabled; config cannot disable
    # a row). Exports carry the harness home's anonymous user id ($DAO_HOME/.anonymous-user-id,
    # random UUID; delete the file to reset the identity) as the Resource's
    # user.id. The default endpoint is the local OTLP/HTTP collector port; a
    # deployment with a real collector sets DAO_TELEMETRY_OTLP_URL. The exporter/processor values normally bound the shutdown drain
    # to ~1s against an unreachable collector: exporter.timeoutMillis is both
    # the per-attempt socket timeout and the retry deadline (1s effectively
    # disables the SDK's 5-try backoff), while maxExportBatchSize == maxQueueSize
    # (both explicit) makes the drain a single batch. The SDK awaits
    # exporter.forceFlush() outside exportTimeoutMillis, so the backend's 3s
    # shutdownTimeoutMillis is the load-bearing outer bound when a transport
    # promise never settles. Every CLI exit path drains it by disposing the root
    # on SIGINT/SIGTERM.
    - id: session-telemetry-otel
      name: '@daoai/dao-session-telemetry-otel'
      config:
        mode: !!js process.env.DAO_TELEMETRY_MODE || 'FEEDBACK_ONLY'
        shutdownTimeoutMillis: 3000
        exporter:
          url: !!js process.env.DAO_TELEMETRY_OTLP_URL ?? 'http://127.0.0.1:4318/v1/logs'
          compression: gzip
          timeoutMillis: 1000
        processor:
          scheduledDelayMillis: 10000
          maxQueueSize: 2048
          maxExportBatchSize: 2048
          exportTimeoutMillis: 1500

    - id: subprocess
      name: '@daoai/dao-subprocess-local'

    # Every shipped CLI mode starts with the same file-effect boundary.
    # The environment remains an explicit deployment override; otherwise fresh
    # sessions pin workspace-write + ask through the permission service below.
    - id: sandbox
      name: '@daoai/dao-sandbox-local'

    - id: sandbox-policy
      name: '@daoai/dao-sandbox-policy'
      config:
        mode: !!js process.env.DAO_PERMISSION_MODE ?? 'workspace-write'
        workspaceRoot: !!js process.cwd()

    - id: bash-sandbox
      name: '@daoai/dao-bash-sandbox'
      disabled: !!js process.platform === 'win32'
      config:
        timeoutMs: 60000

    - id: pwsh-sandbox
      name: '@daoai/dao-pwsh-sandbox'
      disabled: !!js process.platform !== 'win32'

    - id: approval
      name: '@daoai/dao-user-approval'
      config:
        policy: !!js "(process.env.DAO_PERMISSION_MODE ?? 'workspace-write') === 'danger-full-access' ? 'never' : 'ask'"

    - id: permission
      name: '@daoai/dao-permission-presets'
      config:
        presets:
          read-only:
            sandbox: read-only
            approval: ask
          workspace-write:
            sandbox: workspace-write
            approval: ask
          danger-full-access:
            sandbox: danger-full-access
            approval: never

    - id: shell-env
      name: '@daoai/dao-shell-env'

    - id: tool-bash
      name: '@daoai/dao-tool-bash'
      disabled: !!js process.platform === 'win32'

    - id: tool-pwsh
      name: '@daoai/dao-tool-pwsh'
      disabled: !!js process.platform !== 'win32'

    - id: tool-jobs
      name: '@daoai/dao-tool-jobs'

    - id: fs-observation-policy
      name: '@daoai/dao-fs-observation-policy'

    - id: tool-fs
      name: '@daoai/dao-tool-fs'

    - id: tool-fs-search
      name: '@daoai/dao-tool-fs-search'
      config:
        sampleOverCapGlobResults: false

    - id: agent-instructions
      name: '@daoai/dao-agent-instructions'
      config:
        maxBytes: 65536

    - id: skill
      name: '@daoai/dao-skill'

    - id: skill-filesystem
      name: '@daoai/dao-skill-filesystem'

    - id: skill-badge
      name: '@daoai/dao-skill-badge'
      disabled: true

    - id: tool-skill
      name: '@daoai/dao-tool-skill'

    - id: commands
      name: '@daoai/dao-commands'

    - id: command-feedback
      name: '@daoai/dao-command-feedback'

    - id: goal
      name: '@daoai/dao-goal'

    - id: goal-round-driver
      name: '@daoai/dao-goal-round-driver'

    - id: command-goal
      name: '@daoai/dao-command-goal'

    - id: plan-mode
      name: '@daoai/dao-plan-mode'
      config:
        section: |
              You are in plan mode. Stay in plan mode until exit_plan_mode succeeds or the user switches the session mode. Imperative language to implement changes means plan the implementation, not execute it. A user's conversational agreement — including an answer confirming something you asked — approves nothing and does not end plan mode; fold the confirmed decision into the plan and submit it through exit_plan_mode.

              Explore first. Use non-mutating reads, searches, static analysis, and checks to ground the plan in the actual repository. Do not edit or write files, change configuration, run formatters or code generation that rewrites tracked files, commit, or otherwise carry out the plan. Prefer existing functions and patterns over new machinery.

              The tool catalog stays the same across modes for request-cache stability. These plan-mode rules override any later tool description or guidance that suggests using mutation tools; those tools remain listed only to keep the request shape stable. Do not use todo_write to track this planning phase: it tracks implementation after an approved plan, while the plan itself belongs in exit_plan_mode.

              Resolve discoverable facts by inspection. Use ask_user_question only for user-owned choices or material ambiguity that inspection cannot answer. Do not ask the user where code lives or how current behavior works when you can find out.

              Make the plan decision-complete: state the goal and success criteria; group implementation changes by subsystem; identify public API, schema, and data-flow changes; cover edge cases, failure modes, tests, acceptance criteria, and explicit assumptions. Keep it concise enough to review but detailed enough that another engineer can implement it without making design decisions.

              When ready, call exit_plan_mode with the complete plan markdown, starting with a # title. Make exit_plan_mode the only and final tool call in that assistant response: it presents the plan for approval, and implementation begins only in a later step after approval. Do not paste the final plan as a plain reply or ask "should I proceed?" through prose or ask_user_question. If review rejects it, incorporate the feedback and present again. If the review channel is unavailable or aborted, stay in plan mode and ask the user to switch modes manually; do not proceed with implementation.

    - id: token-meter
      name: '@daoai/dao-token-meter'

    - id: compaction-basic
      name: '@daoai/dao-compaction-basic'

    # Human `/compact`: one useful reduction below the automatic threshold. Backend
    # independent, so it follows whichever compaction service this leaf mounts.
    - id: command-compact
      name: '@daoai/dao-command-compact'

    - id: subagent
      name: '@daoai/dao-subagent'

    - id: subagent-spawn-in-process
      name: '@daoai/dao-subagent-spawn-in-process'
      config:
        providerName: spawn

    - id: subagent-fork-in-process
      name: '@daoai/dao-subagent-fork-in-process'
      config:
        providerName: fork

    # Continuable background children are selected per delegation tool. The
    # separately loaded follow-up tool registers the one global `send_message`.
    - id: tool-subagent-control
      name: '@daoai/dao-tool-subagent-control'

    - id: tool-subagent-list-agents
      name: '@daoai/dao-tool-subagent-control/list-agents'

    - id: tool-subagent
      name: '@daoai/dao-tool-subagent'
      config:
        provider: spawn
        toolName: subagent
        backgroundMode: continuable

    # Fork omits model selection so provider/model stay equal to the parent and
    # the inherited history remains eligible for KV Cache reuse. It stays one-shot
    # because a continuable child's `report` tool and prompt section precede that
    # history and invalidate the same prefix.
    # See .agents/notes/implemented/feature/2026-08-18-model-selected-subagent-routes.md
    # and .agents/notes/implemented/architecture/2026-08-10-fork-children-stay-one-shot.md.
    - id: tool-subagent-fork
      name: '@daoai/dao-tool-subagent'
      config:
        provider: fork
        toolName: subagent_fork
        backgroundMode: one-shot

    # Optional direct-child return channel; absent from roots and one-shot agents.
    - id: tool-subagent-report
      name: '@daoai/dao-tool-subagent-report'

    - id: workflow-worker-thread
      name: '@daoai/dao-workflow-worker-thread'
      config:
        provider: spawn

    - id: tool-workflow
      name: '@daoai/dao-tool-workflow'

    - id: timeout-policy
      name: '@daoai/dao-tool-call-timeout-policy'

    - id: spill-local
      name: '@daoai/dao-spill-local'

    - id: spill-policy
      name: '@daoai/dao-spill-policy'
      config:
        maxInlineBytes: 50000

    # Durability checkpoints before each model request and top-level dispatch.
    - id: session-checkpoint-policy
      name: '@daoai/dao-session-checkpoint-policy'

    # Compacts oversized tool results before the broader conversation compactor
    # runs, preserving the model-visible result within the configured budget.
    - id: tool-result-pruner
      name: '@daoai/dao-compaction-tool-result-pruner'
      config:
        thresholdChars: 8192
        headChars: 4096
        tailChars: 1024

    - id: tool-todo
      name: '@daoai/dao-tool-todo'
      config:
        allowParallelInProgress: true

    # Persisted same-session goals reach the model and the slash menu here; the
    # domain, driver, and `/goal` command are above.
    - id: tool-goal
      name: '@daoai/dao-tool-goal'

    # Fresh-agent Ralph iteration over a build-time-fixed script.
    - id: tool-ralph
      name: '@daoai/dao-tool-ralph'
      config:
        subagentProvider: spawn
        maxRounds: 64

    - id: tool-str-replace-editor
      name: '@daoai/dao-tool-str-replace-editor'
      config:
        maxOutputChars: 16000

    # Consecutive-repeat reminders on the tool chain.
    - id: repeat-tool-reminder
      name: '@daoai/dao-repeat-tool-reminder'
      config:
        thresholds: [3, 5, 8]
        argumentsPreviewChars: 500

    # Every mode enables the stable model-facing web_search tool. The Web app's
    # per-agent presets additionally enable web_fetch; other products opt in by
    # overriding tool-web. No search provider ships in the base: a deployment
    # mounts one (e.g. web-search-exa or web-search-perplexity, keyed through the
    # credential store) and pins its id here, or leaves the pin unset to
    # auto-select when exactly one mounted provider is usable. Anonymous fetch
    # accepts only public HTTP(S) destinations, resolves and validates every
    # destination, and pins every actual connection. Search is a full auxiliary
    # model request with server-side retrieval, so it gets 60s while the
    # provider-neutral tool default remains 30s.
    - id: web
      name: '@daoai/dao-web'
      config:
        fetchProvider: http

    - id: web-fetch-http
      name: '@daoai/dao-web-fetch-http'

    - id: tool-web
      name: '@daoai/dao-tool-web'
      config:
        fetch: false
        searchTimeoutMs: 60000

    # ── rows every mode mounts, whose values each overlay may state ──────────────

    # The tool registry. Presentation mode is a deployment choice; omitting it here
    # keeps the schema default (native).
    - id: tools
      name: '@daoai/dao-tools'

    # The deployment persona is a deployment choice; plan-mode and tool plugins own
    # their own prompt sections.
    - id: system-prompt
      name: '@daoai/dao-system-prompt'
      config:
        persona: ''

    # Agents created at startup. The base stays empty; raw overlays may create
    # agents, while Web creates sessions on client request.
    - id: agent-loop
      name: '@daoai/dao-agent-loop'
      config:
        agents: []

    # The sandboxed filesystem provider. `cwd` defaults to `process.cwd()`; an
    # overlay can pin another workspace.
    - id: fs-sandbox
      name: '@daoai/dao-fs-sandbox'
