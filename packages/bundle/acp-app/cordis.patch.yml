# The automation-only ACP application over dao-base. Stdout belongs to ACP.

- id: system-prompt
  config:
    persona: >-
      You are a coding agent powered by the {{model}} model. Your working directory is {{cwd}}.

- id: session-title-llm
  disabled: true

- insert:
    - id: acp-app-startup
      name: '@daoai/dao-acp-app'

    - id: acp
      name: '@daoai/dao-acp'
      inject: [acpAppStartup]
      config:
        # Shipped default: the resident llama-router card's main preset.
        provider: llama-router
        model: Qwen3.8-27B-Q6_K_XL-128K
