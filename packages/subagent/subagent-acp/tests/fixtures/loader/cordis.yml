# Test-only composition: the ACP subagent backend on the real Loader/app path.
# The scripted model delegates once. The driving e2e selects either the cwd
# echo or a remote-limit diagnostic through DAO_TEST_ACP_MODE. `cwd` is
# deliberately omitted so both paths exercise parent-session inheritance. The
# child command path is machine-absolute and arrives through
# DAO_TEST_MOCK_ACP_SERVER.
- id: mock-llm
  name: './mock-delegating-llm.ts'

- id: subagent
  name: '@daoai/dao-subagent'

# The out-of-process ACP backend spawns its child through the subprocess seam.
- id: subprocess
  name: '@daoai/dao-subprocess-local'

- id: subagent-acp
  name: '@daoai/dao-subagent-acp'
  config:
    providerName: acp
    command: !!js process.execPath
    args:
      - !!js process.env.DAO_TEST_MOCK_ACP_SERVER
    permission: reject
    env: !!js "process.env.DAO_TEST_ACP_MODE === 'diagnostic' ? { MOCK_TEXT: 'partial loader answer', MOCK_STOP: 'max_turn_requests' } : { MOCK_ECHO_CWD: '1' }"

- id: tool-subagent
  name: '@daoai/dao-tool-subagent'
  config:
    provider: acp
    toolName: subagent
    # ACP advertises no depthLimit: the child harness owns its own recursion
    # budget, so the local numeric default cannot apply here.
    maxDepth: 'provider-managed'

- id: agent-spine
  name: '@daoai/dao-agent-spine-demo'
  config:
    agents:
      - id: main
        provider: mock
        model: mock-delegate
        cwd: !!js process.cwd()
    persona: 'Test ACP subagent cwd inheritance.'
    workspaceContext: false

- id: persistence
  name: '@daoai/dao-session-persistence-jsonl'
  config:
    root: './.sessions'
    compression: 'none'

- id: checkpoint-policy
  name: '@daoai/dao-session-checkpoint-policy'
