# Minimal tool-pwsh composition: real app boot path, real pwsh executor, real
# foreground + background tool calls; driven by the package's loader.spec.ts.
- id: system-prompt
  name: '@daoai/dao-system-prompt'

- id: tools
  name: '@daoai/dao-tools'

- id: subprocess
  name: '@daoai/dao-subprocess-local'

- id: bash
  name: '@daoai/dao-pwsh-local'
  config:
    graceMs: 200

- id: shell-env
  name: '@daoai/dao-shell-env'

- id: tasks
  name: '@daoai/dao-jobs-local'

- id: tool-jobs
  name: '@daoai/dao-tool-jobs'

- id: tool-pwsh
  name: '@daoai/dao-tool-pwsh'
