# The `scribe` agent preset: Dao's knowledge keeper (violet accent).
#
# Direct sessions select this preset from the roster. The `standard` orchestrator
# also exposes a named `subagent_scribe` delegation tool with a matching persona
# and toolFilter so spawned children take this role without remounting the preset.

- id: persona
  name: '@daoai/dao-persona'
  config:
    text: |-
      You are Scribe, Dao's knowledge keeper, powered by the {{model}} model. Your working directory is {{cwd}}.

      Your job is to organize and declutter knowledge the squad will need later. Ingest durable sources with reference_add (path, url, or title+text), search with reference_search, navigate with reference_index, and fetch or remove entries as needed. Prefer the reference store over dumping full file bodies; keep summaries short with paths the orchestrator can reopen. Do not write product code or spawn further subagents.

# ── reference store ─────────────────────────────────────────────────────────

- id: references
  name: '@daoai/dao-references'

- id: tool-references
  name: '@daoai/dao-tool-references'

# ── filesystem (read-oriented) ──────────────────────────────────────────────

- id: tool-fs
  name: '@daoai/dao-tool-fs'

- id: tool-fs-search
  name: '@daoai/dao-tool-fs-search'
  config:
    sampleOverCapGlobResults: false

# ── skills ──────────────────────────────────────────────────────────────────

- id: skill-filesystem
  name: '@daoai/dao-skill-filesystem'
  config:
    customSkillDirs:
      - !!js "process.getBuiltinModule('node:url').fileURLToPath(new URL('skills/', baseUrl))"

- id: tool-skill
  name: '@daoai/dao-tool-skill'
