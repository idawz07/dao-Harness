# Keyless generic ACP v1 control-surface patch over `dao --profile acp`.

- id: llm-deepseek
  name: '@daoai/dao-llm-deepseek'
  disabled: true

- id: acp
  name: '@daoai/dao-acp'
  config:
    provider: control-fixture
    model: alpha

- id: session-persistence-jsonl
  name: '@daoai/dao-session-persistence-jsonl'
  config:
    root: !!js process.env.DAO_CONFORMANCE_PERSISTENCE_ROOT
    compression: none

- insert:
    - id: control-surface-llm
      name: './control-surface-llm.ts'
