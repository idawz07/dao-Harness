# One-shot coding agent with format-pure stdout. The app bin loads the
# gitignored root `.env` into the process environment; entry configs here are
# the composition base, while user-plane values resolve per request through
# the two providers below.

# User-settings document (`$DAO_HOME/settings.yaml`, hot-reloaded): an
# `llm-pi-ai:` section there overrides the adapter entry below without a
# restart.
- id: settings
  name: '@daoai/dao-settings-file'

# Credential store: the live process environment over `$DAO_HOME/.credentials.yaml`
# (owner-only file, hot-reloaded). The adapter resolves each route's
# `DAO_*_API_KEY` reference through it at each request, so no key is inlined
# in this file.
- id: credentials
  name: '@daoai/dao-credentials-local'

# The pi-ai adapter, carrying the local Qwen3.8 farm on tailscale. The llama
# router (port 8081) is the resident systemd card and the default; the four
# vLLM cards (ports 18080–18083) are on-demand, declared so a card started
# through the service manager (port 8767) serves immediately and is refused
# only while down. Each route resolves its apiKeyEnv reference per request
# through the credential store, so no key is inlined. Context windows are the
# cards' per-slot sizes, not trained model windows.
- id: llm-pi-ai
  name: '@daoai/dao-llm-pi-ai'
  config:
    providers:
      llama-router:
        displayName: Local Llama Router
        apiKeyEnv: LLAMA_ROUTER_API_KEY
        api: openai-completions
        baseURL: http://100.110.212.93:8081/v1
        reasoning: high
        compat:
          thinkingFormat: qwen-chat-template
        models:
          - id: Qwen3.8-27B-Q6_K_XL-128K
            contextWindow: 131072
            maxTokens: 65536
            reasoningEfforts: { off: , minimal: minimal, low: low, medium: medium, high: high }
          - id: Qwen3.8-27B-Q6_K_XL-128K-NoThink
            contextWindow: 131072
            maxTokens: 65536
            input: [text, image]
            reasoningEfforts: false
          - id: Qwen3.8-27B-Q4_K_XL-128K-Vision
            contextWindow: 131072
            maxTokens: 65536
            input: [text, image]
            reasoningEfforts: { off: , minimal: minimal, low: low, medium: medium, high: high }
          - id: Qwen3.8-27B-AD-Q5_K_M-256K-P1-Vision
            contextWindow: 196608
            maxTokens: 65536
            input: [text, image]
            reasoningEfforts: { off: , minimal: minimal, low: low, medium: medium, high: high }
          - id: Qwen3.8-27B-AD-Q5_K_M-256K-P2-Vision
            contextWindow: 131072
            maxTokens: 65536
            input: [text, image]
            reasoningEfforts: { off: , minimal: minimal, low: low, medium: medium, high: high }
          - id: Ornith-1.0-35B
            contextWindow: 131072
            maxTokens: 65536
            input: [text, image]
            reasoningEfforts: false
          - id: Gemma4-12B-Unified
            contextWindow: 32768
            maxTokens: 32768
            input: [text, image]
            reasoningEfforts: false
          - id: Gemma4-E2B-Uncensored-HauhauCS-Aggressive
            contextWindow: 32768
            maxTokens: 32768
            reasoningEfforts: { off: , minimal: minimal, low: low, medium: medium, high: high }
      qwen38-quasar-262k:
        displayName: Qwen3.8 QUASAR 262K (vLLM card)
        apiKeyEnv: QWEN38_QUASAR_API_KEY
        api: openai-completions
        baseURL: http://100.110.212.93:18081/v1
        reasoning: high
        compat:
          thinkingFormat: qwen-chat-template
          supportsDeveloperRole: false
          supportsThinkingTokenBudget: true
        models:
          - id: qwen38-quasar-nvfp4
            name: Qwen3.8-27B QUASAR-QAT NVFP4 262K
            contextWindow: 262144
            maxTokens: 49152
            input: [text, image]
            reasoningEfforts: { off: , minimal: minimal, low: low, medium: medium, high: high, xhigh: xhigh }
      qwen38-cyanwiki-192k:
        displayName: Qwen3.8 Cyanwiki 192K (vLLM card)
        apiKeyEnv: QWEN38_CYANWIKI_API_KEY
        api: openai-completions
        baseURL: http://100.110.212.93:18080/v1
        reasoning: high
        compat:
          thinkingFormat: qwen
          supportsReasoningEffort: true
          supportsDeveloperRole: false
        models:
          - id: qwen38-cyanwiki-awq-g32
            name: Qwen3.8-27B Cyanwiki AWQ 192K (G32 W4A16, MTP-2)
            contextWindow: 196608
            maxTokens: 65536
            input: [text, image]
            reasoningEfforts: { off: , minimal: minimal, low: low, medium: medium, high: high, xhigh: xhigh, max: xhigh }
      qwen38-unsloth-nvfp4-131k:
        displayName: Qwen3.8 Unsloth 131K (vLLM card)
        apiKeyEnv: QWEN38_UNSLOTH_API_KEY
        api: openai-completions
        baseURL: http://100.110.212.93:18082/v1
        reasoning: high
        compat:
          thinkingFormat: qwen-chat-template
          supportsReasoningEffort: false
          supportsDeveloperRole: false
          supportsFinishReason: false
        models:
          - id: qwen38-unsloth-nvfp4
            name: Qwen3.8-27B Unsloth NVFP4 Dynamic V3 131K
            contextWindow: 131072
            maxTokens: 65536
            input: [text, image]
            reasoningEfforts: { off: , minimal: minimal, low: low, medium: medium, high: high, xhigh: xhigh }
      qwen38-ninfer-nvfp4full-262k:
        displayName: Qwen3.8 NInfer 262K (vLLM card)
        apiKeyEnv: QWEN38_NINFER_API_KEY
        api: openai-completions
        baseURL: http://100.110.212.93:18083/v1
        reasoning: high
        compat:
          thinkingFormat: qwen
          supportsReasoningEffort: true
          supportsDeveloperRole: false
        models:
          - id: qwen38-ninfer-nvfp4full
            name: Qwen3.8-27B NInfer NVFP4 Full 262K
            contextWindow: 262144
            maxTokens: 65536
            input: [text, image]
            reasoningEfforts: { off: , minimal: minimal, low: low, medium: medium, high: high, xhigh: xhigh, max: xhigh }

# Managed child-process groups for the bash executor (spawn/kill/output plumbing).
- id: subprocess
  name: '@daoai/dao-subprocess-local'

- id: bash
  name: '@daoai/dao-bash-local'
  config:
    timeoutMs: 60000

# The example composition pre-creates one fresh `main` agent for its test driver.
- id: agent-spine
  name: '@daoai/dao-agent-spine-demo'
  config:
    agents:
      - id: main
        # Shipped default: the resident router card's main preset at the route's
        # `reasoning: high` default.
        provider: llama-router
        model: Qwen3.8-27B-Q6_K_XL-128K
        cwd: !!js process.cwd()
    workspaceContext:
      maxBytes: 65536
    persona: |
      You are headless-agent, a coding assistant powered by the {{model}} model.

      Verify your work by running the code or tests. Keep answers brief and
      factual.

- id: persistence
  name: '@daoai/dao-session-persistence-jsonl'
  config:
    root: './.sessions'
    compression: !!js "process.env.DAO_SNAPSHOT === undefined ? 'zstd' : 'none'"

- id: checkpoint-policy
  name: '@daoai/dao-session-checkpoint-policy'

# Summarize an older range when derived history approaches the context window.
- id: token-meter
  name: '@daoai/dao-token-meter'

- id: compaction-basic
  name: '@daoai/dao-compaction-basic'
  config:
    thresholdRatio: 0.8
    retainRatio: 0.16
    maxTokens: 8192
    compactionRetries: 1

# Projection registry: durable subagent identity (mode/label) folds through
# its registered units; subagent catalog reads fail loud without the capability.
- id: session-projection
  name: '@daoai/dao-session-projection'

# Expose fresh-child `spawn` and completed-prefix `fork` through independent
# in-process backends.
- id: subagent
  name: '@daoai/dao-subagent'

- id: subagent-spawn-in-process
  name: '@daoai/dao-subagent-spawn-in-process'
  config:
    providerName: spawn

- id: subagent-fork-in-process
  name: '@daoai/dao-subagent-fork-in-process'
  config:
    providerName: fork

# Continuable background children are selected per delegation tool. The
# separately loaded control registers global `send_message`; `report` is
# installed only in continuable child scopes.
- id: tool-subagent-control
  name: '@daoai/dao-tool-subagent-control'

- id: tool-subagent-report
  name: '@daoai/dao-tool-subagent-report'

- id: tool-subagent
  name: '@daoai/dao-tool-subagent'
  config:
    provider: spawn
    toolName: subagent
    backgroundMode: continuable
    maxDepth: 1

# Fork omits model selection so provider/model stay equal to the parent and the
# inherited history remains eligible for KV Cache reuse. It stays one-shot because
# a continuable child's `report` tool and prompt section precede that history and
# invalidate the same prefix. `run_in_background` is off as an explicit
# foreground-only choice even though agent-spine-demo mounts the generic Job runtime.
# See .agents/notes/implemented/feature/2026-08-18-model-selected-subagent-routes.md
# and .agents/notes/implemented/architecture/2026-08-10-fork-children-stay-one-shot.md.
- id: tool-subagent-fork
  name: '@daoai/dao-tool-subagent'
  config:
    provider: fork
    toolName: subagent_fork
    backgroundMode: one-shot
    enableRunInBackground: false
    maxDepth: 1

# The worker-thread workflow engine fans a model-written JavaScript script's
# `agent()` calls out through the spawn backend.
- id: workflow-worker-thread
  name: '@daoai/dao-workflow-worker-thread'
  config:
    provider: spawn

- id: tool-workflow
  name: '@daoai/dao-tool-workflow'

# A separate fixed consumer demonstrates fresh-agent Ralph iteration without
# changing the workflow tool or same-session goal behavior.
- id: tool-ralph
  name: '@daoai/dao-tool-ralph'

# `todo_write` replaces the logged whole list.
- id: tool-todo
  name: '@daoai/dao-tool-todo'
  config:
    allowParallelInProgress: true

# Policy loads before the model-facing filesystem tools so writes and edits
# require an observed file. Relative paths resolve from the process cwd.
- id: fs-local
  name: '@daoai/dao-fs-local'
  config:
    cwd: !!js process.cwd()

- id: fs-observation-policy
  name: '@daoai/dao-fs-observation-policy'

- id: tool-fs
  name: '@daoai/dao-tool-fs'
