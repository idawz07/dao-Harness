# Keyless Agent Teams composition over the real headless app and deterministic fixture adapter.
- id: base
  name: '@daoai/cordis-plugin-include'
  config:
    path: ./cordis.yml
    patches:
      - id: llm-deepseek
        name: '@daoai/dao-llm-deepseek'
        disabled: true
      - id: tool-subagent-control
        name: '@daoai/dao-tool-subagent-control'
        disabled: true
      - id: tool-subagent-list-agents
        name: '@daoai/dao-tool-subagent-control/list-agents'
        disabled: true
      - id: tool-subagent-report
        name: '@daoai/dao-tool-subagent-report'
        disabled: true
      - id: tool-subagent
        name: '@daoai/dao-tool-subagent'
        config:
          provider: spawn
          toolName: subagent
          backgroundMode: one-shot
          maxDepth: 1
      - id: tool-subagent-fork
        name: '@daoai/dao-tool-subagent'
        config:
          provider: fork
          toolName: subagent_fork
          backgroundMode: one-shot
          enableRunInBackground: false
          maxDepth: 1
      - insert:
          - id: agent-team
            name: '@daoai/dao-experimental-agent-team'
            config:
              maxMembers: 8
              maxTasks: 256
              maxPendingMessagesPerMember: 64
              maxMessageBytes: 65536
              disposalTimeoutMs: 5000
          - id: tool-agent-team
            name: '@daoai/dao-experimental-tool-agent-team'
            config:
              freshProvider: spawn
              forkProvider: fork
          - id: team-fixture-llm
            name: './tests/fixtures/team-llm.mjs'
