- id: base
  name: '@daoai/cordis-plugin-include'
  config:
    path: ../../cordis.yml
    patches:
      - id: llm-pi-ai
        name: '@daoai/dao-llm-pi-ai'
        config:
          providers:
            llama-router:
              apiKeyEnv: LLAMA_ROUTER_API_KEY
              api: openai-completions
              baseURL: !!js process.env.DAO_SNAPSHOT_BASE_URL
              reasoning: low
              modelOverrides:
                Qwen3.8-27B-Q6_K_XL-128K:
                  maxTokens: 1024
              streamIdleTimeoutMs: 1000
      - id: agent-spine
        config:
          agents:
            - id: main
              provider: llama-router
              model: Qwen3.8-27B-Q6_K_XL-128K
              cwd: !!js process.cwd()
          workspaceContext: false
          persona: 'Keyless pi-ai router defaults snapshot.'
      - id: persistence
        config:
          root: './.sessions'
