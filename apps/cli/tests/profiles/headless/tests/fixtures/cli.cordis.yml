- id: cli-mock-llm
  name: '../../../../../../../packages/test-support/loader-smoke/tests/fixtures/cli-mock-llm.ts'

- id: base
  name: '@daoai/cordis-plugin-include'
  config:
    path: ../../cordis.yml
    patches:
      - id: llm-deepseek
        name: '@daoai/dao-llm-deepseek'
        disabled: true
      - id: agent-spine
        name: '@daoai/dao-agent-spine-demo'
        config:
          agents:
            - id: main
              provider: cli-mock
              model: cli-mock
              cwd: !!js process.cwd()
          workspaceContext: false
          daoHome: './.dao-home'
          skills:
            filesystem:
              agentsHome: './.agents-home'
          persona: 'Keyless headless-agent smoke.'
      - id: persistence
        name: '@daoai/dao-session-persistence-jsonl'
        config:
          root: './.sessions'
